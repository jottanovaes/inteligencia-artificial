{% extends "base.html" %}

{% block body %}
<h1 class="text-3xl font-bold pb-4 text-center">Aluguel</h1>

<form action="{{ url_for('resultado') }}" method="POST"
    class="max-w-md mx-auto p-6 border border-gray-300 rounded-md gap-5 flex flex-col rounded-lg shadow-md">
    <p class="text-lg font-medium  text-white">Tamanho M2:</p>
    <label htmlFor="tamanho_m2" class="block text-sm font-medium text-gray-700 flex flex-col gap-2 ">Digite a área.
        <input id="tamanho_m2" type="number" name="tamanho_m2" id="tamanho_m2" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </label>
    <button type="submit"
        class="z-1 max-sm:hidden inline-block rounded-4xl bg-black px-4 py-2 text-sm/6 font-semibold text-white hover:bg-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 w-fit">Enviar</button>
</form>
{% endblock %}
