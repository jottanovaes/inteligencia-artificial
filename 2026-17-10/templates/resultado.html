{% extends "base.html" %}

{% block body %}
<h1 class="text-3xl font-bold pb-4">Resultado do Cálculo de Aluguel</h1>

{% if erro %}
<p style="color: red;"><strong>Erro:</strong> {{ erro }}</p>
{% else %}
<p>
    Tamanho do imóvel: <strong>{{ tamanho_m2 }} m²</strong>
</p>
<p>
    Valor estimado do aluguel: <strong>R$ {{ "%.2f"|format(valor_previsto) }}</strong>
</p>
{% endif %}

<br>
<a href="{{ url_for('index') }}"
    class="z-1 max-sm:hidden inline-block rounded-4xl bg-black px-4 py-2 text-sm/6 font-semibold text-white hover:bg-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600">
    Voltar para a Página Inicial
</a>
{% endblock %}
